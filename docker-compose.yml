# Ask The Professor shuffle player — QNAP Container Station / docker compose.
#
# This uses the stock public `node:20-alpine` image and bind-mounts this repo
# into it, so there is NOTHING to build and no custom image to pull. That's what
# makes it work when you paste this file into Container Station's "Create
# Application" box (which has no access to a Dockerfile).
#
# BEFORE you start it:
#   1. Put this whole repo on the NAS at the path below (default
#      /share/Container/atp-shuffle) — via File Station or `git clone`.
#   2. If your Container share lives elsewhere, edit the host path in `volumes`.
#
# Then: Container Station → Create Application → paste this file → start,
# or over SSH from the repo folder: `docker compose up -d`.
#
# Open  http://<your-nas-ip>:1234  from any device on your network.
services:
  atp-shuffle:
    image: node:20-alpine
    container_name: atp-shuffle
    working_dir: /app
    command: ["node", "server.mjs"]
    ports:
      - "1234:8080"          # HOST:CONTAINER — change the LEFT number for a different host port
    volumes:
      # host path (repo on the NAS)  :  path inside the container
      - /share/Container/atp-shuffle:/app
    environment:
      PORT: "8080"
      REGEN_ON_START: "true"      # rebuild the episode list when the container starts
      REGEN_INTERVAL_HOURS: "168" # and again every 7 days to pick up new shows (0 = off)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
